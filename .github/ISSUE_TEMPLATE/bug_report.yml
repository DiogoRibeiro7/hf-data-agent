name: Bug report
description: Something behaves differently from what the docs or the code promise.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally starting from the offline defaults (`make install seed ingest`).
      placeholder: |
        1. make seed ingest
        2. curl -s localhost:8000/ask -d '{"question":"..."}'
        3. ...
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: Entrypoint
      options: [HTTP API, Agent UI, Local MCP (stdio), Remote MCP (HTTP), Slack, Library / scripts]
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Model backend
      options: [mock, transformers, openai_compatible, hf_inference]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: "3.11 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      render: shell
