name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests scripts
      - name: ruff format
        run: ruff format --check src tests scripts
      - name: mypy
        run: mypy src

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # The default developer platform here is Windows; keep it honest.
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest
      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  smoke:
    name: Offline path end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Seed the warehouse and build the knowledge base
        run: |
          python scripts/seed_warehouse.py
          python scripts/ingest.py data/seed

      - name: Ingestion is idempotent
        run: |
          python scripts/ingest.py data/seed
          python - <<'PY'
          import json, pathlib, sys
          chunks = json.loads(pathlib.Path("data/vector_store.json").read_text())
          ids = [c["id"] for c in chunks]
          if len(ids) != len(set(ids)):
              sys.exit(f"re-ingestion duplicated chunks: {len(ids)} rows, {len(set(ids))} unique")
          print(f"ok: {len(ids)} unique chunks")
          PY

      - name: Start the API
        run: |
          python -m data_agent.entrypoints.run_api &
          echo $! > api.pid
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Ask a question
        run: |
          curl -sf localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"How is the daily_revenue DAG scheduled?"}' \
            | tee /dev/stderr | grep -q '"answer"'

      - name: Run a warehouse tool call
        run: |
          curl -sf localhost:8000/tool -H 'content-type: application/json' \
            -d '{"name":"warehouse_query","args":{"sql":"select region, sum(revenue_usd) from revenue group by region"}}' \
            | tee /dev/stderr | grep -q 'EMEA'

      - name: Destructive SQL is refused and the table survives
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' localhost:8000/tool \
            -H 'content-type: application/json' \
            -d '{"name":"warehouse_query","args":{"sql":"DROP TABLE revenue"}}')
          cat body.json
          test "$code" = "400" || { echo "expected 400, got $code"; exit 1; }
          curl -sf localhost:8000/tool -H 'content-type: application/json' \
            -d '{"name":"warehouse_query","args":{"sql":"select count(*) as n from revenue"}}' \
            | tee /dev/stderr | grep -q 'n'

      - name: Stop the API
        if: always()
        run: kill "$(cat api.pid)" || true

  docker:
    name: Container builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hf-data-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Serve
        run: |
          docker run -d --name agent -p 8000:8000 -e DA_MODEL_BACKEND=mock hf-data-agent:ci
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
      - name: Container runs as a non-root user
        run: |
          user=$(docker exec agent id -un)
          echo "container user: $user"
          test "$user" != "root"
      - name: Logs
        if: always()
        run: docker logs agent || true
