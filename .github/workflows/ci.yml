name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests scripts
      - name: ruff format
        run: ruff format --check src tests scripts
      - name: mypy
        run: mypy src

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # The default developer platform here is Windows; keep it honest.
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest
      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  evals:
    name: Retrieval eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      # Retrieval is deterministic with the hashing embedder, so these floors
      # catch a real regression rather than flapping. A regression here is
      # otherwise invisible: the agent still answers confidently, just from the
      # wrong document. Answer scoring needs a real model and is not run here.
      - name: Score retrieval against the golden set
        run: |
          python evals/run_eval.py             --min-hit-rate 0.85             --min-mrr 0.60             --json eval-result.json

      - name: Upload eval result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-result
          path: eval-result.json
          if-no-files-found: warn

  mcp-extra:
    name: Optional mcp extra imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[mcp]"

      # mcp 2.0 removed mcp.server.fastmcp, and nothing here imported the extra,
      # so the MCP entrypoints were broken without any job noticing. This builds
      # the server for real so that cannot happen silently again.
      - name: Build the MCP server
        run: |
          python -c "
          import importlib.metadata as md
          print('mcp', md.version('mcp'))
          from data_agent.mcp.server import build_mcp
          server = build_mcp()
          print('built:', server.name)
          "
      - name: Entrypoints import
        run: |
          python -c "
          from data_agent.entrypoints import mcp_local, mcp_remote
          print('entrypoints import cleanly')
          "

      # The remote transport is only authenticated because mcp_remote wraps it.
      # Assert the wrapped app really refuses an anonymous request.
      - name: The bearer gate rejects an unauthenticated MCP request
        run: |
          python -c "
          import anyio
          from data_agent.mcp.auth import BearerAuthMiddleware
          from data_agent.mcp.server import build_mcp

          app = BearerAuthMiddleware(build_mcp().streamable_http_app(), 'ci-token')
          sent = []

          async def receive():
              return {'type': 'http.request', 'body': b'', 'more_body': False}

          async def send(message):
              sent.append(message)

          scope = {'type': 'http', 'path': '/mcp', 'method': 'POST', 'headers': []}
          anyio.run(app, scope, receive, send)
          status = next(m['status'] for m in sent if m['type'] == 'http.response.start')
          assert status == 401, f'expected 401, got {status}'
          print('anonymous MCP request rejected with', status)
          "

  smoke:
    name: Offline path end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Seed the warehouse and build the knowledge base
        run: |
          python scripts/seed_warehouse.py
          python scripts/ingest.py data/seed

      - name: Ingestion is idempotent
        run: |
          python scripts/ingest.py data/seed
          python - <<'PY'
          import json, pathlib, sys
          chunks = json.loads(pathlib.Path("data/vector_store.json").read_text())
          ids = [c["id"] for c in chunks]
          if len(ids) != len(set(ids)):
              sys.exit(f"re-ingestion duplicated chunks: {len(ids)} rows, {len(set(ids))} unique")
          print(f"ok: {len(ids)} unique chunks")
          PY

      - name: Start the API
        run: |
          python -m data_agent.entrypoints.run_api &
          echo $! > api.pid
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Ask a question
        run: |
          curl -sf localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"How is the daily_revenue DAG scheduled?"}' \
            | tee /dev/stderr | grep -q '"answer"'

      - name: Run a warehouse tool call
        run: |
          curl -sf localhost:8000/tool -H 'content-type: application/json' \
            -d '{"name":"warehouse_query","args":{"sql":"select region, sum(revenue_usd) from revenue group by region"}}' \
            | tee /dev/stderr | grep -q 'EMEA'

      - name: Destructive SQL is refused and the table survives
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' localhost:8000/tool \
            -H 'content-type: application/json' \
            -d '{"name":"warehouse_query","args":{"sql":"DROP TABLE revenue"}}')
          cat body.json
          test "$code" = "400" || { echo "expected 400, got $code"; exit 1; }
          curl -sf localhost:8000/tool -H 'content-type: application/json' \
            -d '{"name":"warehouse_query","args":{"sql":"select count(*) as n from revenue"}}' \
            | tee /dev/stderr | grep -q 'n'

      - name: Stop the API
        if: always()
        run: kill "$(cat api.pid)" || true

  docker:
    name: Container builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hf-data-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: An exposed port with no auth is refused
        run: |
          # The image binds 0.0.0.0 so -p works, which makes the port routable.
          # Starting it with neither a token nor an explicit opt-out must fail.
          if docker run --rm -e DA_MODEL_BACKEND=mock hf-data-agent:ci; then
            echo "container started unauthenticated on a routable bind"; exit 1
          fi
          echo "refused, as intended"

      - name: Serve
        run: |
          docker run -d --name agent -p 8000:8000             -e DA_MODEL_BACKEND=mock             -e DA_ALLOW_UNAUTHENTICATED=true             hf-data-agent:ci
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
      - name: Container runs as a non-root user
        run: |
          user=$(docker exec agent id -un)
          echo "container user: $user"
          test "$user" != "root"
      - name: Logs
        if: always()
        run: docker logs agent || true
