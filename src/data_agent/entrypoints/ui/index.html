<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HF Data Agent</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font:15px/1.5 ui-sans-serif,system-ui,sans-serif;
      background:#0d1117; color:#e6edf3; display:flex; justify-content:center; }
    main { width:min(760px,100%); padding:24px; }
    h1 { font-size:18px; color:#7ee0c8; letter-spacing:.04em; }
    #log { display:flex; flex-direction:column; gap:12px; margin:16px 0; }
    .msg { padding:12px 14px; border-radius:10px; white-space:pre-wrap;
      overflow-wrap:anywhere; }
    .you { background:#161b22; border:1px solid #21262d; }
    .bot { background:#10211c; border:1px solid #1c3b32; }
    .err { background:#2a1416; border:1px solid #5c2a2f; color:#ffb4ab; }
    .src { font-size:12px; color:#9aa7b2; margin-top:6px; white-space:normal; }
    form { display:flex; gap:8px; }
    input { flex:1; padding:12px; border-radius:10px; border:1px solid #21262d;
      background:#0d1117; color:#e6edf3; }
    button { padding:12px 18px; border:0; border-radius:10px; cursor:pointer;
      background:#f0b429; color:#0d1117; font-weight:600; }
    button[disabled] { opacity:.5; cursor:progress; }
  </style>
</head>
<body>
  <main>
    <h1>HF DATA AGENT</h1>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="f">
      <input id="q" placeholder="Ask about your data…" autocomplete="off"
             aria-label="Question" />
      <button id="send">Ask</button>
    </form>
  </main>
  <script>
    const TOKEN_KEY = "da_api_token";

    // Sent only when the page has been given a token; an open server needs none.
    function ask(question) {
      const headers = { "Content-Type": "application/json" };
      const token = sessionStorage.getItem(TOKEN_KEY);
      if (token) headers["Authorization"] = "Bearer " + token;
      return fetch("/ask/stream", {
        method: "POST",
        headers,
        body: JSON.stringify({ question, entrypoint: "ui" }),
      });
    }

    // Server-Sent Events, decoded incrementally. Frames are separated by a
    // blank line; a partial frame is kept until the rest of it arrives.
    async function* frames(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let split;
        while ((split = buffer.indexOf("\n\n")) !== -1) {
          const block = buffer.slice(0, split);
          buffer = buffer.slice(split + 2);
          let name = "message";
          let data = "";
          for (const line of block.split("\n")) {
            if (line.startsWith("event: ")) name = line.slice(7).trim();
            else if (line.startsWith("data: ")) data += line.slice(6);
          }
          if (data) yield [name, JSON.parse(data)];
        }
      }
    }

    const log = document.getElementById("log");
    const input = document.getElementById("q");
    const send = document.getElementById("send");

    // Everything rendered here — the question, the model's answer, and the
    // knowledge-base source names — is untrusted: answers and source names can
    // both be influenced by ingested documents. Text goes in as text, never as
    // markup, so nothing on this page can be turned into an injection vector.
    function note(bubble, label) {
      const line = document.createElement("div");
      line.className = "src";
      line.textContent = label;
      bubble.appendChild(line);
      return line;
    }

    function add(cls, text, sources, steps) {
      const bubble = document.createElement("div");
      bubble.className = "msg " + cls;
      bubble.textContent = text;
      if (steps && steps.length) {
        const used = steps.map((s) => (s.ok ? s.tool : s.tool + " (failed)"));
        note(bubble, "tools: " + used.join(" → "));
      }
      if (sources && sources.length) {
        note(bubble, "sources: " + sources.join(", "));
      }
      log.appendChild(bubble);
      bubble.scrollIntoView({ behavior: "smooth" });
      return bubble;
    }

    document.getElementById("f").addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      add("you", question);
      input.value = "";
      send.disabled = true;
      const pending = add("bot", "…");

      try {
        let response = await ask(question);
        if (response.status === 401) {
          // The server has DA_API_TOKEN set. Ask once, keep it for this tab
          // only (sessionStorage, not localStorage), and retry.
          const supplied = window.prompt("This agent requires an API token:");
          if (supplied) {
            sessionStorage.setItem(TOKEN_KEY, supplied);
            response = await ask(question);
          }
        }
        if (response.status === 401) {
          sessionStorage.removeItem(TOKEN_KEY);
          throw new Error("401 — the token was missing or not accepted.");
        }
        if (!response.ok) {
          const detail = await response.text();
          throw new Error(`${response.status} ${response.statusText} — ${detail}`);
        }

        pending.textContent = "";
        const tools = [];
        let toolLine = null;

        for await (const [name, payload] of frames(response)) {
          if (name === "delta") {
            // textContent, never innerHTML: this text is model output.
            pending.textContent += payload.text;
            pending.scrollIntoView({ behavior: "smooth", block: "end" });
          } else if (name === "step") {
            tools.push(payload.ok ? payload.tool : payload.tool + " (failed)");
            if (!toolLine) toolLine = note(pending, "");
            toolLine.textContent = "tools: " + tools.join(" → ");
          } else if (name === "error") {
            throw new Error(payload.detail);
          } else if (name === "done") {
            const sources = [...new Set((payload.contexts || []).map((c) => c.source))];
            if (sources.length) note(pending, "sources: " + sources.join(", "));
            if (payload.step_limit_reached) {
              note(pending, "note: stopped at the tool-call limit");
            }
          }
        }
        if (!pending.textContent) pending.textContent = "(no answer)";
      } catch (error) {
        pending.remove();
        add("err", "Request failed: " + error.message);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
