services:
  agent-api:
    build: .
    ports: ["8000:8000"]
    # Optional: absent .env is fine, the defaults run offline.
    env_file:
      - path: .env
        required: false
    environment:
      DA_MODEL_BACKEND: openai_compatible
      DA_MODEL_BASE_URL: http://model:8000/v1
      DA_LOG_FORMAT: json
      # Set DA_API_TOKEN in .env to require a bearer token. Without one the
      # service refuses to start, because the published port is routable.
      DA_ALLOW_UNAUTHENTICATED: ${DA_ALLOW_UNAUTHENTICATED:-false}
    depends_on: [model]
    volumes: ["./data:/app/data"]
    restart: unless-stopped

  # Vector store for DA_VECTOR_BACKEND=qdrant. The JSON store is the default
  # and needs none of this.
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_storage:/qdrant/storage"]
    restart: unless-stopped

  # Open HF model served behind an OpenAI-compatible API.
  # Needs a GPU; drop this service and use DA_MODEL_BACKEND=mock|hf_inference otherwise.
  model:
    image: vllm/vllm-openai:latest
    command: ["--model", "Qwen/Qwen2.5-7B-Instruct"]
    ports: ["8001:8000"]
    volumes: ["~/.cache/huggingface:/root/.cache/huggingface"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  qdrant_storage:
