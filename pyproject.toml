[project]
name = "hf-data-agent"
dynamic = ["version"]
description = "Open-source-LLM data agent: multi-entrypoint -> Agent API -> HF model, with RAG + live data platform tools."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Diogo Ribeiro" }]
keywords = ["llm", "agent", "rag", "mcp", "huggingface", "data-platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/hf-data-agent"
Repository = "https://github.com/DiogoRibeiro7/hf-data-agent"
Issues = "https://github.com/DiogoRibeiro7/hf-data-agent/issues"
Changelog = "https://github.com/DiogoRibeiro7/hf-data-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
transformers = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.30"]
embeddings = ["sentence-transformers>=3.0"]
mcp = ["mcp>=1.2"]
slack = ["slack-bolt>=1.18"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-requests",
]
all = ["hf-data-agent[transformers,embeddings,mcp,slack,dev]"]

[project.scripts]
data-agent-api = "data_agent.entrypoints.run_api:main"
data-agent-mcp-local = "data_agent.entrypoints.mcp_local:main"
data-agent-mcp-remote = "data_agent.entrypoints.mcp_remote:main"
data-agent-slack = "data_agent.entrypoints.slack_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/data_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

# ---------------------------------------------------------------- tests ----
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=data_agent",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
filterwarnings = ["error", "ignore::DeprecationWarning:httpx.*"]
markers = [
    "integration: exercises a real external service; skipped by default in CI",
]

[tool.coverage.run]
branch = true
source = ["data_agent"]
omit = [
    # Thin `main()` shims around a server library; exercised by running them.
    "*/entrypoints/*",
    # Requires torch + a model download, so it is not covered in CI.
    "*/model/transformers_provider.py",
    # Requires the optional `mcp` / `slack_bolt` extras.
    "*/mcp/server.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ----------------------------------------------------------------- lint ----
[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "S",      # flake8-bandit
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific
]
ignore = [
    "S101",   # assert: used deliberately in tests
    "RET504", # a named result before return is often clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "SLF001"]
"scripts/**" = ["T201"]  # these are CLIs; printing is the interface

[tool.ruff.lint.isort]
known-first-party = ["data_agent"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- types ----
[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true
# Optional heavy backends are imported lazily and ship no stubs.
# These modules bridge to the optional mcp / slack extras. Those packages are not
# installed in the type-check environment, so their decorators arrive untyped and
# every decorated handler is flagged. The bridges are thin and delegate straight
# into typed code, so only this specific check is relaxed, and only here.
[[tool.mypy.overrides]]
module = ["data_agent.mcp.server", "data_agent.entrypoints.slack_app"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "sentence_transformers.*",
    "torch.*",
    "mcp.*",
    "slack_bolt.*",
]
ignore_missing_imports = true
